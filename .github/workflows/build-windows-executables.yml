name: build-windows-executables

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6 lz4 cryptography pyinstaller

      - name: Build native backend
        run: cmake -S CrimsonSaveEditorCpp -B cppbuild; cmake --build cppbuild

      - name: Stage backend for PyInstaller
        run: if (Test-Path cppbuild/parc_parser.dll) { Copy-Item cppbuild/parc_parser.dll CrimsonSaveEditor/ }

      - name: Build Save Editor
        run: python build.py --project saveeditor

      - name: Build Game Mods
        run: python build.py --project gamemods

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            CrimsonSaveEditor/dist/*.exe
            CrimsonGameMods/dist/*.exe
